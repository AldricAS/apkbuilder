name: Build APK

on:
  push:
    branches: [builds]
    paths: ['uploads/*.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Baca metadata upload
        id: prep
        run: |
          META=$(git diff --name-only HEAD^ HEAD -- uploads | grep '\.json$' | head -1)
          if [ -z "$META" ]; then echo "::error::Metadata upload tidak ditemukan"; exit 1; fi
          ID=$(basename "$META" .json)
          {
            echo "id=$ID"
            echo "mtype=$(jq -r '.type' "$META")"
            echo "url=$(jq -r '.url' "$META")"
            echo "app_name=$(jq -r '.appName' "$META")"
            echo "app_id=$(jq -r '.appId' "$META")"
            echo "theme=$(jq -r '.themeColor // ""' "$META")"
            echo "has_logo=$(jq -r '.hasLogo // false' "$META")"
            echo "fullscreen=$(jq -r '.fullscreen // false' "$META")"
            echo "no_splash=$(jq -r '.noSplash // false' "$META")"
            echo "orientation=$(jq -r '.orientation // "auto"' "$META")"
          } >> "$GITHUB_OUTPUT"

      - name: Ambil proyek dan deteksi jenisnya
        id: src
        env:
          ID: ${{ steps.prep.outputs.id }}
          MTYPE: ${{ steps.prep.outputs.mtype }}
          URL: ${{ steps.prep.outputs.url }}
        run: |
          if [ "$MTYPE" = "link" ]; then
            { echo "type=weblink"; echo "java=21"; echo "root=."; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "uploads/$ID.zip" src.zip
          unzip -tq src.zip > /dev/null \
            || { echo "::error::File bukan zip yang valid"; exit 1; }
          mkdir -p src && unzip -q src.zip -d src

          GW=$(find src -name gradlew -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          IDX=$(find src -name index.html -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$GW" ]; then
            { echo "type=android"; echo "java=17"; echo "root=$(dirname "$GW")"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$IDX" ]; then
            { echo "type=web"; echo "java=21"; echo "root=$(dirname "$IDX")"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tidak ada gradlew (proyek Android) maupun index.html (proyek web) di dalam proyek"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.src.outputs.java }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build proyek Android (Gradle)
        if: steps.src.outputs.type == 'android'
        env:
          ID: ${{ steps.prep.outputs.id }}
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK debug tidak ditemukan setelah build"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/app-$ID.apk"

      - name: Siapkan proyek web (Capacitor)
        if: steps.src.outputs.type == 'web'
        env:
          ROOT: ${{ steps.src.outputs.root }}
          APP_NAME: ${{ steps.prep.outputs.app_name }}
          APP_ID: ${{ steps.prep.outputs.app_id }}
        run: |
          mkdir cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp -r "$GITHUB_WORKSPACE/$ROOT"/. www/
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android

      - name: Siapkan proyek dari link web (Capacitor)
        if: steps.src.outputs.type == 'weblink'
        env:
          APP_NAME: ${{ steps.prep.outputs.app_name }}
          APP_ID: ${{ steps.prep.outputs.app_id }}
          SITE_URL: ${{ steps.prep.outputs.url }}
        run: |
          mkdir cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><body style="font-family:sans-serif;padding:2rem"><h3>Tidak bisa membuka situs</h3><p>Periksa koneksi internet lalu buka ulang aplikasi.</p>' > www/index.html
          jq -n --arg id "$APP_ID" --arg name "$APP_NAME" --arg url "$SITE_URL" \
            '{appId:$id, appName:$name, webDir:"www", server:{url:$url, cleartext:false}}' > capacitor.config.json
          npx cap add android

      - name: Terapkan logo dan tema
        if: (steps.src.outputs.type == 'web' || steps.src.outputs.type == 'weblink') && (steps.prep.outputs.theme != '' || steps.prep.outputs.has_logo == 'true')
        env:
          ID: ${{ steps.prep.outputs.id }}
          THEME: ${{ steps.prep.outputs.theme }}
          HAS_LOGO: ${{ steps.prep.outputs.has_logo }}
        run: |
          cd cap
          cat > apply-look.cjs <<'JSEOF'
          // Menerapkan logo dan warna tema ke proyek Capacitor (dijalankan dari folder cap/)
          const fs = require('fs');
          const THEME = process.env.THEME || '';
          const LOGO = process.env.LOGO || '';
          const clear = { r: 0, g: 0, b: 0, alpha: 0 };

          function isLight(hex) {
            const n = parseInt(hex.slice(1), 16);
            const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6;
          }

          function patchConfig() {
            if (fs.existsSync('capacitor.config.json')) {
              const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              c.backgroundColor = THEME;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
            } else if (fs.existsSync('capacitor.config.ts')) {
              let t = fs.readFileSync('capacitor.config.ts', 'utf8');
              t = t.replace(/(const config[^{]*\{)/, `$1\n  backgroundColor: '${THEME}',`);
              fs.writeFileSync('capacitor.config.ts', t);
            } else {
              console.log('::warning::capacitor.config tidak ditemukan, warna latar webview dilewati');
            }
          }

          function patchStyles() {
            const f = 'android/app/src/main/res/values/styles.xml';
            let s = fs.readFileSync(f, 'utf8');
            const bars =
              `\n        <item name="android:statusBarColor">${THEME}</item>` +
              `\n        <item name="android:navigationBarColor">${THEME}</item>` +
              `\n        <item name="android:windowLightStatusBar">${isLight(THEME)}</item>` +
              `\n        <item name="android:windowLightNavigationBar">${isLight(THEME)}</item>`;
            s = s.replace(/<style name="AppTheme\.NoActionBar"[^>]*>/, (m) => m + bars);
            if (s.includes('Theme.SplashScreen')) {
              s = s.replace(/<style name="AppTheme\.NoActionBarLaunch"[^>]*>/, (m) =>
                m + `\n        <item name="windowSplashScreenBackground">${THEME}</item>`);
            }
            fs.writeFileSync(f, s);
          }

          async function makeAssets() {
            const sharp = require('sharp');
            const bg = THEME || '#FFFFFF';
            fs.mkdirSync('assets', { recursive: true });

            const logoAt = (size) =>
              sharp(LOGO).resize(size, size, { fit: 'contain', background: clear }).png().toBuffer();
            const onCanvas = async (canvas, color, logoSize, out) => {
              const base = sharp({ create: { width: canvas, height: canvas, channels: 4, background: color } });
              await base.composite([{ input: await logoAt(logoSize), gravity: 'center' }]).png().toFile(out);
            };

            // ikon adaptif: logo di area aman (sekitar 60%), latar polos dari warna tema
            await onCanvas(1024, clear, 880, 'assets/icon-foreground.png');
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: bg } })
              .png().toFile('assets/icon-background.png');
            await onCanvas(1024, bg, 720, 'assets/icon-only.png');
            // splash screen: logo di tengah latar warna tema
            await onCanvas(2732, bg, 720, 'assets/splash.png');
            await onCanvas(2732, bg, 720, 'assets/splash-dark.png');
          }

          (async () => {
            if (THEME) { patchConfig(); patchStyles(); }
            if (LOGO) await makeAssets();
          })().catch((e) => { console.error('::error::' + e.message); process.exit(1); });
          JSEOF
          export LOGO=""
          if [ "$HAS_LOGO" = "true" ]; then
            LOGO="$GITHUB_WORKSPACE/uploads/$ID.png"
            [ -f "$LOGO" ] || { echo "::error::File logo tidak ditemukan"; exit 1; }
            npm i sharp @capacitor/assets@3
          fi
          node apply-look.cjs
          if [ -n "$LOGO" ]; then
            npx capacitor-assets generate --android
          fi

      - name: Terapkan fullscreen, splash, dan orientasi
        if: (steps.src.outputs.type == 'web' || steps.src.outputs.type == 'weblink') && (steps.prep.outputs.fullscreen == 'true' || steps.prep.outputs.no_splash == 'true' || steps.prep.outputs.orientation != 'auto')
        env:
          FULLSCREEN: ${{ steps.prep.outputs.fullscreen }}
          NO_SPLASH: ${{ steps.prep.outputs.no_splash }}
          ORIENT: ${{ steps.prep.outputs.orientation }}
          THEME: ${{ steps.prep.outputs.theme }}
        run: |
          cd cap
          cat > apply-display.cjs <<'JSEOF'
          // Menerapkan fullscreen, tanpa splash, dan orientasi ke proyek Android hasil "cap add" (dijalankan dari folder cap/)
          const fs = require('fs');
          const path = require('path');
          const FULL = process.env.FULLSCREEN === 'true';
          const NOSPLASH = process.env.NO_SPLASH === 'true';
          const ORIENT = process.env.ORIENT || 'auto';
          const THEME = process.env.THEME || '';
          const MAIN = 'android/app/src/main';
          const MANIFEST = MAIN + '/AndroidManifest.xml';
          const STYLES = MAIN + '/res/values/styles.xml';
          const warn = (m) => console.log('::warning::' + m);

          // portrait: terkunci tegak. landscape: terkunci mendatar (boleh terbalik ikut sensor).
          // auto: tidak diatur, jadi mengikuti pengaturan putar otomatis di HP.
          function patchOrientation() {
            const val = ORIENT === 'portrait' ? 'portrait' : ORIENT === 'landscape' ? 'sensorLandscape' : '';
            if (!val) return;
            const m = fs.readFileSync(MANIFEST, 'utf8');
            const next = m.replace(/<activity\b(?=[^>]*MainActivity)/, `<activity android:screenOrientation="${val}"`);
            if (next === m) return warn('Activity utama tidak ditemukan di AndroidManifest, orientasi dilewati');
            fs.writeFileSync(MANIFEST, next);
          }

          function addItems(s, name, items) {
            const re = new RegExp(`(<style name="${name.replace(/\./g, '\\.')}"[^>]*>)`);
            if (!re.test(s)) { warn(`style ${name} tidak ditemukan, sebagian pengaturan dilewati`); return s; }
            return s.replace(re, (m) => m + items);
          }

          function patchStyles() {
            let s = fs.readFileSync(STYLES, 'utf8');
            // item yang dipakai kalau fullscreen: status bar hilang, konten mengisi area poni/notch
            const fullItems = FULL
              ? '\n        <item name="android:windowFullscreen">true</item>' +
                '\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
              : '';

            if (FULL) s = addItems(s, 'AppTheme.NoActionBar', fullItems);

            if (NOSPLASH) {
              // splash dibuat polos: tanpa logo dan tanpa gambar, hanya satu warna latar yang
              // langsung diganti tampilan aplikasi. (Android tetap butuh jendela awal sesaat.)
              const bg = THEME || '#FFFFFF';
              const re = /<style name="AppTheme\.NoActionBarLaunch"[^>]*>[\s\S]*?<\/style>/;
              if (!re.test(s)) {
                warn('style launch tidak ditemukan, pengaturan tanpa splash dilewati');
              } else if (s.includes('Theme.SplashScreen')) {
                s = s.replace(re,
                  '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">' +
                  `\n        <item name="windowSplashScreenBackground">${bg}</item>` +
                  '\n        <item name="windowSplashScreenAnimatedIcon">@drawable/nosplash_icon</item>' +
                  '\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>' +
                  `\n        <item name="android:background">${bg}</item>` +
                  fullItems + '\n    </style>');
              } else {
                s = s.replace(re,
                  '<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">' +
                  `\n        <item name="android:background">${bg}</item>` + '\n    </style>');
              }
              // ikon splash transparan 1dp
              const dir = MAIN + '/res/drawable';
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(dir + '/nosplash_icon.xml',
                '<?xml version="1.0" encoding="utf-8"?>\n' +
                '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n' +
                '    <solid android:color="#00000000" />\n' +
                '    <size android:width="1dp" android:height="1dp" />\n' +
                '</shape>\n');
            } else if (FULL) {
              s = addItems(s, 'AppTheme.NoActionBarLaunch', fullItems);
            }
            fs.writeFileSync(STYLES, s);
          }

          function findFile(dir, name) {
            if (!fs.existsSync(dir)) return null;
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { const r = findFile(p, name); if (r) return r; }
              else if (e.name === name) return p;
            }
            return null;
          }

          // fullscreen imersif: status bar dan tombol navigasi disembunyikan, muncul sementara kalau digeser dari tepi
          function writeActivity() {
            const f = findFile(MAIN + '/java', 'MainActivity.java');
            if (!f) return warn('MainActivity.java tidak ditemukan, mode imersif dilewati');
            const pkg = (fs.readFileSync(f, 'utf8').match(/^package\s+([\w.]+);/m) || [])[1];
            if (!pkg) return warn('Package MainActivity tidak terbaca, mode imersif dilewati');
            fs.writeFileSync(f, [
              `package ${pkg};`,
              '',
              'import android.os.Bundle;',
              'import android.view.Window;',
              'import androidx.core.view.WindowCompat;',
              'import androidx.core.view.WindowInsetsCompat;',
              'import androidx.core.view.WindowInsetsControllerCompat;',
              'import com.getcapacitor.BridgeActivity;',
              '',
              'public class MainActivity extends BridgeActivity {',
              '    @Override',
              '    public void onCreate(Bundle savedInstanceState) {',
              '        super.onCreate(savedInstanceState);',
              '        hideSystemBars();',
              '    }',
              '',
              '    @Override',
              '    public void onResume() {',
              '        super.onResume();',
              '        hideSystemBars();',
              '    }',
              '',
              '    @Override',
              '    public void onWindowFocusChanged(boolean hasFocus) {',
              '        super.onWindowFocusChanged(hasFocus);',
              '        if (hasFocus) hideSystemBars();',
              '    }',
              '',
              '    private void hideSystemBars() {',
              '        Window w = getWindow();',
              '        WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());',
              '        c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);',
              '        c.hide(WindowInsetsCompat.Type.systemBars());',
              '    }',
              '}',
              '',
            ].join('\n'));
          }

          try {
            patchOrientation();
            if (FULL || NOSPLASH) patchStyles();
            if (FULL) writeActivity();
          } catch (e) { console.error('::error::' + e.message); process.exit(1); }
          JSEOF
          node apply-display.cjs

      - name: Build APK Capacitor (Gradle)
        if: steps.src.outputs.type == 'web' || steps.src.outputs.type == 'weblink'
        env:
          ID: ${{ steps.prep.outputs.id }}
        run: |
          cd cap
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK debug tidak ditemukan setelah build"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/app-$ID.apk"

      - name: Terbitkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.prep.outputs.id }}
          name: APK ${{ steps.prep.outputs.id }}
          files: out/*.apk

      - name: Hapus file upload dari repo
        if: always()
        env:
          ID: ${{ steps.prep.outputs.id }}
        run: |
          if [ -n "$ID" ]; then
            git config user.name "apkforge-bot"
            git config user.email "apkforge-bot@users.noreply.github.com"
            git rm -q --ignore-unmatch "uploads/$ID.zip" "uploads/$ID.png" "uploads/$ID.json"
            git commit -m "cleanup $ID" || true
            git pull --rebase origin builds || true
            git push origin builds || true
          fi
