name: Build APK

on:
  push:
    branches: [builds]
    paths: ['uploads/*.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Baca metadata upload
        id: prep
        run: |
          META=$(git diff --name-only HEAD^ HEAD -- uploads | grep '\.json$' | head -1)
          if [ -z "$META" ]; then echo "::error::Metadata upload tidak ditemukan"; exit 1; fi
          ID=$(basename "$META" .json)
          {
            echo "id=$ID"
            echo "mtype=$(jq -r '.type' "$META")"
            echo "url=$(jq -r '.url' "$META")"
            echo "app_name=$(jq -r '.appName' "$META")"
            echo "app_id=$(jq -r '.appId' "$META")"
          } >> "$GITHUB_OUTPUT"

      - name: Ambil proyek dan deteksi jenisnya
        id: src
        env:
          ID: ${{ steps.prep.outputs.id }}
          MTYPE: ${{ steps.prep.outputs.mtype }}
          URL: ${{ steps.prep.outputs.url }}
        run: |
          if [ "$MTYPE" = "link" ]; then
            { echo "type=weblink"; echo "java=21"; echo "root=."; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "uploads/$ID.zip" src.zip
          unzip -tq src.zip > /dev/null \
            || { echo "::error::File bukan zip yang valid"; exit 1; }
          mkdir -p src && unzip -q src.zip -d src

          GW=$(find src -name gradlew -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          IDX=$(find src -name index.html -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$GW" ]; then
            { echo "type=android"; echo "java=17"; echo "root=$(dirname "$GW")"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$IDX" ]; then
            { echo "type=web"; echo "java=21"; echo "root=$(dirname "$IDX")"; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tidak ada gradlew (proyek Android) maupun index.html (proyek web) di dalam proyek"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.src.outputs.java }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build proyek Android (Gradle)
        if: steps.src.outputs.type == 'android'
        env:
          ID: ${{ steps.prep.outputs.id }}
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK debug tidak ditemukan setelah build"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/app-$ID.apk"

      - name: Build proyek web (Capacitor)
        if: steps.src.outputs.type == 'web'
        env:
          ID: ${{ steps.prep.outputs.id }}
          ROOT: ${{ steps.src.outputs.root }}
          APP_NAME: ${{ steps.prep.outputs.app_name }}
          APP_ID: ${{ steps.prep.outputs.app_id }}
        run: |
          mkdir cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp -r "$GITHUB_WORKSPACE/$ROOT"/. www/
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK debug tidak ditemukan setelah build"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/app-$ID.apk"

      - name: Build dari link web (Capacitor)
        if: steps.src.outputs.type == 'weblink'
        env:
          ID: ${{ steps.prep.outputs.id }}
          APP_NAME: ${{ steps.prep.outputs.app_name }}
          APP_ID: ${{ steps.prep.outputs.app_id }}
          SITE_URL: ${{ steps.prep.outputs.url }}
        run: |
          mkdir cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><body style="font-family:sans-serif;padding:2rem"><h3>Tidak bisa membuka situs</h3><p>Periksa koneksi internet lalu buka ulang aplikasi.</p>' > www/index.html
          jq -n --arg id "$APP_ID" --arg name "$APP_NAME" --arg url "$SITE_URL" \
            '{appId:$id, appName:$name, webDir:"www", server:{url:$url, cleartext:false}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find . -name '*.apk' -path '*debug*' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK debug tidak ditemukan setelah build"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/app-$ID.apk"

      - name: Terbitkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.prep.outputs.id }}
          name: APK ${{ steps.prep.outputs.id }}
          files: out/*.apk

      - name: Hapus file upload dari repo
        if: always()
        env:
          ID: ${{ steps.prep.outputs.id }}
        run: |
          if [ -n "$ID" ]; then
            git config user.name "apkforge-bot"
            git config user.email "apkforge-bot@users.noreply.github.com"
            git rm -q --ignore-unmatch "uploads/$ID.zip" "uploads/$ID.json"
            git commit -m "cleanup $ID" || true
            git pull --rebase origin builds || true
            git push origin builds || true
          fi
          
